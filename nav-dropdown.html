<style>
/* 펼침 화살표(caret) 제거 */
.navbar-nav .dropdown-toggle::after {
  display: none;
}

/* Popper 없이 순수 CSS hover로 열기 때문에, 위치를 직접 고정 (안 그러면 메뉴끼리 겹침) */
.navbar-nav .nav-item.dropdown {
  position: relative;
}

.navbar-nav .nav-item.dropdown .dropdown-menu {
  position: absolute;
  top: 100% !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translateX(-50%) !important;
  margin-top: 0;
}

/* 드롭다운을 가로 한 줄로, 모서리는 둥글게 (표시 여부는 아래 hover 규칙에서만 결정) */
.navbar-nav .dropdown-menu {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 0.25rem;
  min-width: max-content;
  padding: 0.5rem;
  border-radius: 12px;
  border: 1px solid rgba(0, 0, 0, 0.08);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}

.navbar-nav .dropdown-menu .dropdown-item {
  width: auto;
  white-space: nowrap;
  border-radius: 8px;
}

/* 햄버거 메뉴(좁은 화면)에서는 떠 있는 팝업 대신 목록 안에서 세로로 펼침 */
@media (max-width: 991px) {
  .navbar-nav .nav-item.dropdown .dropdown-menu {
    position: static !important;
    transform: none !important;
    left: auto !important;
    top: auto !important;
    min-width: 0;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 0;
    padding: 0 0 0.25rem 1rem;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
  }
}

/* 마우스 있는 기기에서는 클릭 없이 hover로만 드롭다운 노출 */
@media (hover: hover) and (pointer: fine) {
  .navbar-nav .nav-item.dropdown:hover > .dropdown-menu {
    display: flex;
  }
}
</style>

<script>
(function () {
  var hoverCapable = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  // 상위 메뉴 텍스트 → 전체 보기 페이지 매핑.
  var overviewPages = {
    "Home": "index.html",
    "PhD in US": "phd-in-us.html",
    "Living in US": "living-in-us.html",
    "Research": "research.html"
  };

  // hover 가능한 기기(데스크톱)에서는 상위 항목 클릭 시 바로 전체 보기 페이지로
  // 이동하고 하위 메뉴는 hover로 연다. 터치 기기(모바일)에서는 hover가 없으므로
  // 첫 탭은 하위 메뉴 펼치기, 펼쳐진 상태에서 한 번 더 탭하면 전체 보기 페이지로
  // 이동한다.

  // 글 페이지(/posts/.../)에서도 맞는 주소가 되도록, 페이지 깊이에 맞게 Quarto가
  // 계산해둔 로고 링크(../../../index.html 등)에서 사이트 루트를 구한다.
  var brand = document.querySelector(".navbar-brand");
  var siteRoot = brand ? brand.href.replace(/index\.html$/, "") : "/";

  document.querySelectorAll(".navbar-nav .nav-item.dropdown > .dropdown-toggle").forEach(function (toggle) {
    var label = toggle.textContent.trim();
    var href = overviewPages[label];
    if (!href) return;

    if (hoverCapable) {
      // 상위 항목 클릭은 Bootstrap의 토글 가로채기 대신 바로 전체 보기 페이지로 이동
      toggle.removeAttribute("data-bs-toggle");
      toggle.setAttribute("href", siteRoot + href);
    } else {
      // Bootstrap의 드롭다운 토글은 document의 캡처 단계에서 실행되므로, 그보다
      // 앞선 window 캡처 단계에서 먼저 확인한다. 이미 펼쳐져 있는(.show) 상태의
      // 탭이면 Bootstrap이 닫아버리기 전에 가로채서 전체 보기 페이지로 이동.
      window.addEventListener("click", function (e) {
        if (!toggle.contains(e.target) || !toggle.classList.contains("show")) return;
        e.preventDefault();
        e.stopPropagation();
        window.location.href = siteRoot + href;
      }, true);
    }
  });
})();
</script>
