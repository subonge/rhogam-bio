<style>
/* 펼침 화살표(caret) 제거 */
.navbar-nav .dropdown-toggle::after {
  display: none;
}

/* Popper 없이 순수 CSS hover로 열기 때문에, 위치를 직접 고정 (안 그러면 메뉴끼리 겹침) */
.navbar-nav .nav-item.dropdown {
  position: relative;
}

.navbar-nav .nav-item.dropdown .dropdown-menu {
  position: absolute;
  top: 100% !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translateX(-50%) !important;
  margin-top: 0;
}

/* 드롭다운을 가로 한 줄로, 모서리는 둥글게 (표시 여부는 아래 hover 규칙에서만 결정) */
.navbar-nav .dropdown-menu {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 0.25rem;
  min-width: max-content;
  padding: 0.5rem;
  border-radius: 12px;
  border: 1px solid rgba(0, 0, 0, 0.08);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}

.navbar-nav .dropdown-menu .dropdown-item {
  width: auto;
  white-space: nowrap;
  border-radius: 8px;
}

/* 마우스 있는 기기에서는 클릭 없이 hover로만 드롭다운 노출 */
@media (hover: hover) and (pointer: fine) {
  .navbar-nav .nav-item.dropdown:hover > .dropdown-menu {
    display: flex;
  }
}
</style>

<script>
(function () {
  var hoverCapable = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  // 상위 메뉴 텍스트 → 전체 보기 페이지 매핑. PhD in US / Living in US /
  // Research는 모든 기기에서 클릭 시 바로 이동 (하위 항목은 허브 페이지
  // 안의 섹션이라 터치 기기에서도 스크롤로 다 닿을 수 있음).
  var overviewPages = {
    "PhD in US": "phd-in-us.html",
    "Living in US": "living-in-us.html",
    "Research": "research.html"
  };

  // Home만 예외: hover 가능한 기기(데스크톱)에서는 Posts 클릭과 동일하게
  // 바로 이동하되, 터치 기기에서는 기본 클릭-토글(펼치기) 동작을 유지한다 —
  // About me는 다른 페이지의 섹션이 아니라 완전히 별도 페이지라서, 터치
  // 기기에서 Home도 바로 이동해버리면 펼쳐서 About me로 갈 방법이 없어진다.
  if (hoverCapable) {
    overviewPages["Home"] = "index.html";
  }

  document.querySelectorAll(".navbar-nav .nav-item.dropdown > .dropdown-toggle").forEach(function (toggle) {
    var label = toggle.textContent.trim();
    var href = overviewPages[label];
    if (!href) return;

    // 상위 항목 클릭은 Bootstrap의 토글 가로채기 대신 바로 전체 보기 페이지로 이동
    toggle.removeAttribute("data-bs-toggle");
    toggle.setAttribute("href", href);
  });
})();
</script>
